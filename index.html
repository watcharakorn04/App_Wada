<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Digital Attendance</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* สไตล์ Custom Modal แจ้งเตือน */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .modal-header {
            font-size: 16px;
            font-weight: bold;
            color: #1565c0;
            margin-bottom: 10px;
        }
        .modal-body {
            font-size: 13px;
            color: #444;
            margin-bottom: 20px;
            line-height: 1.5;
            white-space: pre-line;
        }
        .modal-btn {
            background: #5c6bc0;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="main-content" style="display:flex; flex-direction:column; justify-content:center; min-height:100vh;">
            <div class="card">
                <div style="text-align:center; margin-bottom:15px;">
                    <span style="font-size:40px;">⏱️</span>
                    <h2 style="color:#1565c0; margin-top:5px;">Digital Attendance</h2>
                    <p style="font-size:12px; color:#78909c;">ระบบลงเวลา & สะสมชั่วโมงฝึกงาน</p>
                </div>

                <!-- แท็บสลับหน้า -->
                <div style="display:flex; gap:6px; margin-bottom:16px;">
                    <button class="btn-small" id="tab-login-btn" style="flex:1; background:#5c6bc0; color:white; padding:8px 4px;">เข้าสู่ระบบนักศึกษา</button>
                    <button class="btn-small" id="tab-reg-btn" style="flex:1; background:#e0e0e0; color:#424242; padding:8px 4px;">ลงทะเบียนใหม่</button>
                    <button class="btn-small" id="tab-hr-btn" style="flex:1; background:#e0e0e0; color:#424242; padding:8px 4px;">สำหรับ HR</button>
                </div>

                <!-- 1. ฟอร์มเข้าสู่ระบบนักศึกษา -->
                <form id="login-form">
                    <label style="font-size:12px; color:#555;">อีเมลนักศึกษา (@internchubb.com)</label>
                    <input type="email" id="login-email" placeholder="wada@internchubb.com" required>
                    
                    <label style="font-size:12px; color:#555;">รหัสผ่าน</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                    
                    <div style="text-align:right; margin-top:4px; margin-bottom:8px;">
                        <a href="#" id="btn-forgot-password" style="font-size:12px; color:#5c6bc0; text-decoration:none;">ลืมรหัสผ่าน?</a>
                    </div>

                    <button type="submit" class="btn-checkin" style="background:#5c6bc0; margin-top:4px;">เข้าสู่ระบบนักศึกษา</button>
                </form>

                <!-- 2. ฟอร์มลงทะเบียนนักศึกษาใหม่ -->
                <form id="register-form" style="display:none;">
                    <label style="font-size:12px; color:#555;">อีเมลนักศึกษา (@internchubb.com)</label>
                    <input type="email" id="reg-email" placeholder="wada@internchubb.com" required>
                    
                    <label style="font-size:12px; color:#555;">ตั้งรหัสผ่าน (อย่างน้อย 6 ตัว)</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                    
                    <label style="font-size:12px; color:#555;">ชื่อจริง</label>
                    <input type="text" id="reg-firstname" placeholder="สมชาย" required>
                    
                    <label style="font-size:12px; color:#555;">นามสกุล</label>
                    <input type="text" id="reg-lastname" placeholder="ใจดี" required>
                    
                    <label style="font-size:12px; color:#555;">ชื่อเล่น</label>
                    <input type="text" id="reg-nickname" placeholder="ชาย" required>
                    
                    <label style="font-size:12px; color:#555;">แผนกฝึกงาน</label>
                    <input type="text" id="reg-dept" placeholder="เช่น Finance" required>
                    
                    <label style="font-size:12px; color:#555;">เป้าหมายชั่วโมงฝึกงาน</label>
                    <input type="number" id="reg-target" value="560" required>
                    
                    <button type="submit" class="btn-checkin" style="background:#26a69a; margin-top:8px;">ลงทะเบียนนักศึกษา</button>
                </form>

                <!-- 3. ฟอร์มเข้าสู่ระบบ HR -->
                <form id="hr-login-form" style="display:none;">
                    <div style="background:#fff3e0; padding:10px; border-radius:8px; margin-bottom:12px; text-align:center;">
                        <p style="font-size:12px; color:#e65100; font-weight:bold;">💼 เข้าสู่ระบบสำหรับ HR (@hrchubb.com)</p>
                    </div>
                    <label style="font-size:12px; color:#555;">อีเมลบัญชี HR</label>
                    <input type="email" id="hr-email" placeholder="farm@hrchubb.com" required>
                    
                    <label style="font-size:12px; color:#555;">รหัสผ่าน HR</label>
                    <input type="password" id="hr-password" placeholder="••••••••" required>
                    
                    <button type="submit" class="btn-checkin" style="background:#f57c00; margin-top:8px;">เข้าสู่ระบบ HR Dashboard</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Custom Modal Popup -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">Digital Attendance</div>
            <div id="modal-msg" class="modal-body"></div>
            <button id="modal-close-btn" class="modal-btn">ตกลง</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
